spring:
  application:
    name: your-application-name
  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/tlias
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: your username
    password: your password
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      # password: only if your Redis requires auth
      timeout: 3000ms
  servlet:
    multipart:
      # the max size of a single file
      max-file-size: 10MB
      # the max size of the request (including file and form data)
      max-request-size: 10MB
  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing schema baseline"

# MyBatis
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # Enable CamelCase Naming Convention Mapping
    map-underscore-to-camel-case: true

# config the logging level of the transaction manager
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# JWT
jwt:
  # secret used to sign JWT tokens (must be at least 32 chars for HMAC-SHA256)
  secret: your-jwt-secret-here-at-least-32-characters-long
  # access token expiration in ms (default 15 minutes)
  access-expiration-ms: 900000
  # refresh token expiration in ms (default 7 days)
  refresh-expiration-ms: 604800000

# AWS S3
aws:
  s3:
    region: your-region
    bucket: your-bucket-name
